apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-app
  labels:
   app: php-app


spec:
  replicas: 3
  selector:
    matchLabels:
      app: php-app


  template:
    metadata:
     name: php-app
     labels:
      app: php-app


    spec:
     containers:
      - name: php-container
        image: mvlvk77/php-app:latest
        ports:
          - containerPort: 80     

        env:
           - name: DB_HOST
             value: "mysql-service"         
           - name: DB_USER
             value: "root"
           - name: DB_PASS
             value: "root"
           - name: DB_PORT
             value: "3306"
           - name: DB_NAME
             value: "db-test"           
        