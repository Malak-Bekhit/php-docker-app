---
services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    platform: linux/amd64
    restart: always
    environment:
        MYSQL_ROOT_PASSWORD: root 
        MYSQL_DATABASE: db-test
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql  

  php:
    container_name: php-task
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - db    

  volumes:
    db_data:    