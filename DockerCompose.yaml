---
services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD: root 
      - MYSQL_DATABASE: php_data


  web:
    container_name: php-task
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depend_on:
      - db    